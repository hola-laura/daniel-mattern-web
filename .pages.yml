media:
  input: media
  output: media

content:
  - name: portada
    label: 1. Portada
    type: file
    path: content/portada.json
    format: json
    fields:
      - { name: tituloBlanco, label: "Título (parte blanca)", type: text, required: true }
      - { name: tituloColor, label: "Título (parte en color)", type: text, required: true }
      - { name: entradilla, label: Subtítulo, type: text }
      - { name: botonPrincipal, label: Texto del botón principal, type: string }
      - { name: botonSecundario, label: Texto del botón secundario, type: string }
      - { name: titulaciones, label: Titulaciones, type: string, list: true }
      - { name: foto, label: Foto de fondo, type: image }
      - name: encuadre
        label: Parte de la foto que se ve
        type: select
        options: { values: [Arriba, Centro, Abajo] }

  - name: rutas
    label: 2. Rutas y próximas salidas
    type: file
    path: content/rutas.json
    format: json
    list: true
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: publicada, label: Visible en la web, type: boolean, default: true }
      - name: tipo
        label: Tipo de actividad
        type: select
        required: true
        options: { values: [Senderismo, Trekking, Escalada, Raquetas, Cursos] }
      - name: cordillera
        label: Cordillera
        type: select
        required: true
        options: { values: [Sistema Central, Pirineos, Picos de Europa, Sierra Nevada, Alpes, Atlas, Andes, Himalaya] }
      - { name: zona, label: Zona, type: string }
      - name: nivel
        label: Nivel de dificultad
        type: select
        required: true
        options: { values: [Iniciación, Medio, Exigente, Técnico] }
      - { name: grado, label: "Grado (MIDE, escalada o duración)", type: string }
      - { name: distanciaKm, label: Distancia en km, type: number, options: { min: 0 } }
      - { name: desnivelM, label: Desnivel positivo en metros, type: number, options: { min: 0 } }
      - { name: duracion, label: Duración, type: string }
      - { name: precio, label: Precio por persona en euros, type: number, required: true, options: { min: 0 } }
      - { name: plazasMax, label: Plazas máximas por salida, type: number, required: true, options: { min: 1 } }
      - { name: descripcion, label: Descripción, type: text }
      - { name: encuentro, label: Punto de encuentro, type: string }
      - { name: incluye, label: Qué incluye, type: string, list: true }
      - { name: material, label: Qué traer, type: string, list: true }
      - name: fotos
        label: Fotos de la ruta
        type: image
        options: { multiple: { max: 12 } }
      - { name: altitudes, label: "Altitudes del recorrido en metros", description: "Puntos en orden para dibujar el perfil", type: number, list: true }
      - name: salidas
        label: Próximas salidas
        type: object
        list: true
        fields:
          - { name: inicio, label: Fecha de inicio, type: date, required: true }
          - { name: fin, label: Fecha de fin (solo si dura varios días), type: date, default: "" }
          - { name: plazasLibres, label: Plazas libres, type: number, required: true, options: { min: 0 } }

  - name: servicios
    label: 3. Servicios
    type: file
    path: content/servicios.json
    format: json
    list: true
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: descripcion, label: Descripción, type: text }
      - { name: precio, label: Texto del precio, type: string }
      - { name: enlace, label: Texto del enlace, type: string }
      - name: destino
        label: A dónde lleva el enlace
        type: select
        options: { values: [Senderismo, Trekking, Escalada, Raquetas, Cursos, Contacto] }

  - name: cordilleras
    label: 4. Montañas y cordilleras
    type: file
    path: content/cordilleras.json
    format: json
    list: true
    fields:
      - { name: nombre, label: Nombre, type: string, required: true }
      - name: grupo
        label: Grupo
        type: select
        required: true
        options: { values: [España, El mundo] }
      - { name: zona, label: Zona, type: string }
      - { name: cumbre, label: Cumbre más alta, type: string }
      - { name: altitud, label: Altitud de la cumbre en metros, type: number, options: { min: 0 } }
      - { name: foto, label: Foto, type: image }

  - name: reservas
    label: 5. Reserva y pago
    type: file
    path: content/reservas.json
    format: json
    fields:
      - { name: antetitulo, label: Antetítulo, type: string }
      - { name: titulo, label: Título, type: string }
      - { name: entradilla, label: Entradilla, type: text }
      - { name: senalPorcentaje, label: Señal en porcentaje, type: number, options: { min: 0, max: 100 } }
      - { name: diasPagoResto, label: Días antes para pagar el resto, type: number, options: { min: 0 } }
      - name: pasos
        label: Pasos para reservar
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
      - name: formasPago
        label: Formas de pago
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: descripcion, label: Descripción, type: text }
      - name: cancelacion
        label: Condiciones de cancelación
        type: object
        list: true
        fields:
          - { name: cuando, label: Cuándo, type: string }
          - { name: devolucion, label: Devolución, type: string }

  - name: sobre-mi
    label: 6. Sobre mí
    type: file
    path: content/sobre-mi.json
    format: json
    fields:
      - { name: antetitulo, label: Antetítulo, type: string }
      - { name: nombre, label: Nombre, type: string }
      - { name: foto, label: Foto, type: image }
      - { name: parrafos, label: Párrafos, type: text, list: true }
      - { name: titulaciones, label: Titulaciones, type: string, list: true }

  - name: preguntas
    label: 7. Preguntas frecuentes
    type: file
    path: content/preguntas.json
    format: json
    list: true
    fields:
      - { name: pregunta, label: Pregunta, type: string, required: true }
      - { name: respuesta, label: Respuesta, type: text, required: true }

  - name: secciones
    label: 8. Títulos de secciones y fotos
    type: file
    path: content/secciones.json
    format: json
    fields:
      - name: salidas
        label: Próximas salidas
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: entradilla, label: Entradilla, type: text }
          - { name: notaFinal, label: Nota final, type: string }
          - { name: enlaceFinal, label: Enlace de la nota, type: string }
      - name: servicios
        label: Servicios
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: entradilla, label: Entradilla, type: text }
          - { name: foto, label: Foto de fondo, type: image }
      - name: destinos
        label: Cordilleras
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: entradilla, label: Entradilla, type: text }
      - name: rutas
        label: Rutas
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: entradilla, label: Entradilla, type: text }
          - { name: notaEscalas, label: Nota sobre escalas, type: text }
      - name: niveles
        label: Explicación de los niveles
        type: object
        fields:
          - { name: iniciacion, label: Iniciación, type: text }
          - { name: medio, label: Medio, type: text }
          - { name: exigente, label: Exigente, type: text }
          - { name: tecnico, label: Técnico, type: text }
      - name: cita
        label: Cita
        type: object
        fields:
          - { name: texto, label: Texto, type: text }
          - { name: autora, label: Autoría, type: string }
          - { name: foto, label: Foto de fondo, type: image }
      - name: preguntas
        label: Preguntas
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
      - name: contacto
        label: Contacto
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: botonEnviar, label: Texto del botón, type: string }
          - { name: foto, label: Foto de fondo, type: image }

  - name: general
    label: 9. Datos generales
    type: file
    path: content/general.json
    format: json
    fields:
      - { name: tituloPagina, label: Título en el navegador y Google, type: string }
      - { name: descripcion, label: Descripción para Google, type: text }
      - { name: nombre, label: Nombre, type: string }
      - { name: descriptor, label: Texto bajo el nombre, type: string }
      - { name: mostrarAviso, label: Mostrar banda de aviso, type: boolean }
      - { name: aviso, label: Texto de la banda de aviso, type: string }
      - { name: botonReservar, label: Texto del botón de reservar, type: string }
      - { name: instagram, label: Usuario de Instagram, type: string }
      - { name: telefono, label: Teléfono, type: string }
      - { name: email, label: Correo electrónico, type: string }
      - { name: pie, label: Texto del pie, type: string }
      - { name: legal, label: Enlaces legales, type: string }
