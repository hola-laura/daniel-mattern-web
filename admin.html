<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Daniel Mattern</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sofia+Sans+Extra+Condensed:wght@800&display=swap">
<style>
/* Layout: barra lateral de secciones y zona de trabajo con lista y ficha de edición. */
:root{
  --bg:#F4F7F1; --surface:#FFFFFF; --fg:#2F434D; --muted:#5A6F79; --line:#D5E0E1; --line-strong:#8DAF97; --link:#3B5A4A;
  --deep:#2F4A3A; --deep-2:#3B5A4A; --on-deep:#F6F9F8; --on-deep-muted:#E0E9EA; --accent:#C8E3C1; --on-accent:#2F434D; --notice:#DDE8D8; --danger:#A33A2B; --ok:#3B5A4A; --chart:#456853; --chart-fill:#DDE8D8;
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif; --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18241D;--surface:#212F27;--fg:#E8EFE9;--muted:#B2C2B7;--line:#37493E;--link:#C8E3C1;--deep:#24392D;--deep-2:#2F4A3A;--danger:#F2A493;--ok:#C8E3C1;--chart:#8DAF97;--chart-fill:#2F4A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18241D;--surface:#212F27;--fg:#E8EFE9;--muted:#B2C2B7;--line:#37493E;--link:#C8E3C1;--deep:#24392D;--deep-2:#2F4A3A;--danger:#F2A493;--ok:#C8E3C1;--chart:#8DAF97;--chart-fill:#2F4A3A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:2px}
h1,h2,h3,p,ul{margin:0;padding:0;list-style:none}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--deep);color:var(--on-deep);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:block;width:100%;padding:0;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.brand b{display:block;font:800 1.6rem/1 var(--f-display);text-transform:uppercase;padding-inline:8px}
.brand span{display:block;padding:3px 8px 0;font:400 .72rem/1.2 var(--f-mono);color:var(--on-deep-muted)}
.menu{display:grid;gap:2px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:42px;padding:8px;background:none;border:0;border-radius:4px;color:var(--on-deep);font-weight:600;text-align:left}
.menu button[aria-current="page"]{background:var(--deep-2)}
.menu button:disabled{color:var(--on-deep-muted);opacity:.7;font-weight:500}
.menu small{font:400 .66rem/1 var(--f-mono)}
.side .view{margin-top:auto;color:var(--accent);font-weight:600;padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.demo{background:var(--notice);color:#2F434D;font-size:.88rem;font-weight:600;padding:7px 28px}
.work{padding:30px clamp(16px,3vw,36px) 0;max-width:1040px;width:100%;margin-inline:auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
h1{font:800 clamp(2.6rem,5vw,3.6rem)/.95 var(--f-display);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border:2px solid transparent;border-radius:3px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn.plain{background:none;color:var(--link);padding-inline:6px;min-height:36px}
.btn.danger{background:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1B241E}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1;min-width:200px}
input,select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--link)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px 86px 112px;gap:12px;align-items:center;width:100%;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--bg)}
.item b{display:block;line-height:1.25}
.item small{color:var(--muted);font-size:.86rem}
.mono{font:400 .8rem/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.pill{justify-self:start;padding:2px 8px;border-radius:999px;background:var(--notice);color:#2F434D;font:500 .72rem/1.5 var(--f-mono)}
.pill.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:grid;gap:15px}
.card h2{font-size:1.05rem}
.help{color:var(--muted);font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.field label,.lab{font-size:.88rem;font-weight:600}
.check{display:flex;gap:9px;align-items:center;font-weight:600}
.err{color:var(--danger);font-size:.84rem;font-weight:600}
.sal{display:grid;grid-template-columns:1fr 1fr 110px 40px;gap:8px;align-items:end}
.sal+.sal{padding-top:10px;border-top:1px solid var(--line)}
.x{width:40px;height:42px;border:0;background:none;font-size:1.3rem;color:var(--danger);cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:4/3;background:var(--bg);border-radius:3px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;padding:2px 8px;border:0;border-radius:3px;background:var(--surface);font-size:.76rem;font-weight:600;cursor:pointer}
.url-row{display:flex;gap:8px}
.url-row input{flex:1;min-width:0}
.perfil{touch-action:pan-y}
.perfil svg{display:block;width:100%;height:auto;cursor:crosshair;user-select:none;-webkit-user-select:none}
.pt{cursor:ns-resize;touch-action:none;outline:none}
.pt .h{fill:var(--surface);stroke:var(--chart);stroke-width:2.5}
.pt.on .h,.pt:focus-visible .h{fill:var(--accent);stroke:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nums summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.nums .field{margin-top:8px}
dialog{width:min(480px,calc(100vw - 32px));border:0;border-radius:6px;padding:22px;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(16,30,22,.4)}
dialog::backdrop{background:rgba(18,32,24,.6)}
dialog h2{font:800 2.2rem/1 var(--f-display);text-transform:uppercase;margin-bottom:8px}
dialog p{color:var(--muted);margin-bottom:16px}
.work>:last-child:not(.savebar){margin-bottom:56px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:9px;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:5px;background:var(--deep);color:var(--on-deep);font-weight:700;box-shadow:0 10px 30px rgba(16,30,22,.3);animation:sube .18s ease-out}
.toast.error{background:var(--danger);color:#fff}
:root[data-theme="dark"] .toast.error{color:#1B241E}
.toast svg{flex:none}
.toast.acciones{flex-wrap:wrap;justify-content:center;gap:8px 12px;width:min(560px,calc(100vw - 32px))}
.toast.acciones>span{margin-right:auto}
.toast .btn{min-height:36px;padding:5px 12px;font-size:.92rem}
.toast .btn.ghost{color:var(--on-deep);border-color:var(--on-deep-muted)}
@keyframes sube{from{transform:translate(-50%,8px)}to{transform:translate(-50%,0)}}
.rep{display:grid;gap:12px}
.rep-item{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:4px}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ico{width:38px;height:38px;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer;font-size:1rem}
.ico:disabled{opacity:.35;cursor:not-allowed}
.ico.del{color:var(--danger);font-size:1.3rem}
.fila{display:flex;align-items:center;gap:6px;padding-right:10px;border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.item2{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer}
.item2 b{display:block;line-height:1.25}
.item2 small{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.86rem}
.item2:hover b{text-decoration:underline}
.thumb{flex:none;width:64px;height:48px;border-radius:3px;background:var(--notice);object-fit:cover}
.ph.una{max-width:280px;margin-bottom:6px}
.url-row .btn{flex:none;min-height:42px}
body.conectado .solo-demo{display:none}
.login{max-width:380px;margin:12vh auto;padding:24px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.item.salida{grid-template-columns:128px minmax(0,1fr) auto auto}
.esq{display:grid;gap:14px}
.esq i{display:block;height:92px;border-radius:4px;background:var(--line);animation:latido 1.2s ease-in-out infinite}
.esq i.t{height:52px;width:45%}
@keyframes latido{50%{opacity:.55}}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:0 calc(-1*clamp(16px,3vw,36px));padding:11px clamp(16px,3vw,36px);background:var(--surface);border-top:1px solid var(--line)}
.status{color:var(--ok);font-weight:600;font-size:.92rem;min-height:1.4em}
.status.dirty{color:var(--muted);font-weight:500}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1.5px solid var(--danger);border-radius:4px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;gap:10px;padding-block:12px}
  .menu{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
  .side .view{margin-top:0;padding-block:0}
  .demo{padding-inline:16px}
  .grid,.grid2{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr) auto}
  .item .hide{display:none}
  .item.salida{grid-template-columns:minmax(0,1fr) auto}
  .item.salida>.mono{grid-column:1/-1}
  .sal{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <button class="brand" id="logo" aria-label="Ir al inicio del panel"><b>Daniel Mattern</b><span>panel de la web</span></button>
    <nav class="menu" id="menu" aria-label="Secciones del panel"></nav>
    <a class="view" href="index.html" target="_blank" rel="noopener">Ver la web</a>
  </aside>
  <div class="main">
    <p class="demo" id="modo"></p>
    <main class="work" id="work" aria-live="polite"><p class="empty">Cargando…</p></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="salir" aria-labelledby="salir-t"><h2 id="salir-t">Guarda tu progreso</h2><p>Tienes cambios sin guardar. Si sales ahora, se perderán.</p><div class="row"><button class="btn" id="salir-guardar">Guardar y salir</button><button class="btn ghost" id="salir-seguir">Seguir editando</button><button class="btn plain" id="salir-descartar" style="color:var(--danger)">Salir sin guardar</button></div></dialog>

<script src="config.js"></script>
<script>
"use strict";
/* Almacén de datos. En modo demostración usa este navegador; al conectar Supabase solo cambia este objeto. */
const API=window.CONFIG?.API_URL||"";
let remoto=null;
const Sesion={get(){try{return sessionStorage.getItem("dm-clave")||""}catch{return ""}},set(v){try{sessionStorage.setItem("dm-clave",v)}catch{}},borrar(){try{sessionStorage.removeItem("dm-clave")}catch{}}};
async function llamar(cuerpo){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...cuerpo,password:Sesion.get()})});
  if(!r.ok)throw new Error("red");const j=await r.json();
  if(!j.ok){const e=new Error(j.error||"error");e.codigo=j.error;throw e}return j;
}
const CACHE="dm-cache";
const leerCache=()=>{try{return JSON.parse(localStorage.getItem(CACHE)||"null")}catch{return null}};
const escribirCache=d=>{try{localStorage.setItem(CACHE,JSON.stringify(d))}catch{}};
const Almacen={
  clave:a=>"dm-demo-"+a,
  async base(a){if(!API)try{const g=localStorage.getItem(this.clave(a));if(g)return JSON.parse(g)}catch{}
    const r=await fetch(`content/${a}.json`,{cache:"no-cache"});if(!r.ok)throw new Error(a);return r.json()},
  async cargar(a){return this.base(a)},
  remoto(){return fetch(API).then(r=>{if(!r.ok)throw new Error("red");return r.json()})},
  async guardar(a,datos){if(API){await llamar({accion:"guardar",clave:a,datos});const c=leerCache()||{};c[a]=datos;escribirCache(c)}else localStorage.setItem(this.clave(a),JSON.stringify(datos))},
  async restaurar(a){try{localStorage.removeItem(this.clave(a))}catch{}}
};
const ARCHIVOS=["rutas","portada","servicios","cordilleras","reservas","sobre-mi","preguntas","secciones","general"];
const DATOS={};
const TIPOS=["Senderismo","Trekking","Escalada","Raquetas","Cursos"],NIVELES=["Iniciación","Medio","Exigente","Técnico"];
const nombresCordillera=actual=>{const l=DATOS.cordilleras.map(c=>c.nombre);return actual&&!l.includes(actual)?[actual,...l]:l};
const clon=o=>JSON.parse(JSON.stringify(o));
const val=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
function setv(o,p,v){const ks=p.split("."),l=ks.pop();ks.reduce((a,k,i)=>a[k]??=(/^\d+$/.test(ks[i+1]??l)?[]:{}),o)[l]=v}
const T={k:"titulo",l:"Título"},EN={k:"entradilla",l:"Entradilla",f:"area"},AT={k:"antetitulo",l:"Antetítulo"};
const SEC={
  portada:{nombre:"Portada",arch:"portada",grupos:[{t:"Título",c:[{k:"tituloBlanco",l:"Primera parte, en blanco",f:"area",req:1,ayuda:"Pulsa Intro para bajar de línea."},{k:"tituloColor",l:"Segunda parte, en color",f:"area",ayuda:"Pulsa Intro para bajar de línea."}]},{t:"Texto y botones",c:[{k:"entradilla",l:"Subtítulo",f:"area"},{k:"botonPrincipal",l:"Botón principal"},{k:"botonSecundario",l:"Botón secundario"},{k:"titulaciones",l:"Titulaciones",f:"lineas"}]},{t:"Foto de fondo",c:[{k:"foto",l:"Foto",f:"foto"},{k:"encuadre",l:"Parte de la foto que se ve",f:"sel",ops:["Arriba","Centro","Abajo"]}]}]},
  salidas:{nombre:"Próximas salidas",arch:"rutas"},
  servicios:{nombre:"Servicios",arch:"servicios",lista:1,clave:"titulo",sub:i=>i.precio,nuevo:()=>({titulo:"",descripcion:"",precio:"",enlace:"Ver más",destino:"Contacto"}),singular:"servicio",grupos:[{t:"Servicio",c:[{...T,req:1},{k:"descripcion",l:"Descripción",f:"area"},{k:"precio",l:"Texto del precio",ayuda:"Por ejemplo: desde 45 € / persona."},{k:"enlace",l:"Texto del enlace"},{k:"destino",l:"A dónde lleva el enlace",f:"sel",ops:["Senderismo","Trekking","Escalada","Raquetas","Cursos","Contacto"]}]}]},
  cordilleras:{nombre:"Cordilleras",arch:"cordilleras",lista:1,clave:"nombre",foto:"foto",sub:i=>`${i.grupo} · ${i.cumbre||"Sin cumbre"}`,nuevo:()=>({nombre:"",grupo:"España",zona:"",cumbre:"",altitud:0,foto:""}),singular:"cordillera",grupos:[{t:"Cordillera",c:[{k:"nombre",l:"Nombre",req:1},{k:"grupo",l:"Grupo",f:"sel",ops:["España","El mundo"]},{k:"zona",l:"Zona"},{k:"cumbre",l:"Cumbre más alta"},{k:"altitud",l:"Altitud de la cumbre (m)",f:"num",min:0}]},{t:"Foto",c:[{k:"foto",l:"Foto de la tarjeta",f:"foto"}]}]},
  rutas:{nombre:"Rutas"},
  reservas:{nombre:"Reserva y pago",arch:"reservas",grupos:[{t:"Textos",c:[AT,T,EN]},{t:"Pago",c:[{k:"senalPorcentaje",l:"Señal (%)",f:"num",min:0,max:100},{k:"diasPagoResto",l:"Días antes para pagar el resto",f:"num",min:0}]},{t:"Pasos para reservar",c:[{k:"pasos",l:"Paso",f:"rep",nuevo:{titulo:"",texto:""},c:[T,{k:"texto",l:"Texto",f:"area"}]}]},{t:"Formas de pago",c:[{k:"formasPago",l:"Forma de pago",f:"rep",nuevo:{nombre:"",descripcion:""},c:[{k:"nombre",l:"Nombre"},{k:"descripcion",l:"Descripción",f:"area"}]}]},{t:"Cancelación",c:[{k:"cancelacion",l:"Condición",f:"rep",nuevo:{cuando:"",devolucion:""},c:[{k:"cuando",l:"Cuándo"},{k:"devolucion",l:"Devolución"}]}]}]},
  "sobre-mi":{nombre:"Sobre mí",arch:"sobre-mi",grupos:[{t:"Presentación",c:[AT,{k:"nombre",l:"Nombre"},{k:"foto",l:"Foto",f:"foto"}]},{t:"Biografía",c:[{k:"parrafos",l:"Párrafo",f:"rep",simple:1,nuevo:"",campo:{l:"Texto",f:"area"}}]},{t:"Titulaciones",c:[{k:"titulaciones",l:"Titulaciones",f:"lineas"}]}]},
  preguntas:{nombre:"Preguntas",arch:"preguntas",lista:1,clave:"pregunta",sub:i=>i.respuesta,nuevo:()=>({pregunta:"",respuesta:""}),singular:"pregunta",grupos:[{t:"Pregunta",c:[{k:"pregunta",l:"Pregunta",req:1},{k:"respuesta",l:"Respuesta",f:"area",req:1}]}]},
  textos:{nombre:"Textos de secciones",arch:"secciones",grupos:[{t:"Próximas salidas",c:[{k:"salidas.antetitulo",l:"Antetítulo"},{k:"salidas.titulo",l:"Título"},{k:"salidas.entradilla",l:"Entradilla",f:"area"},{k:"salidas.notaFinal",l:"Nota final"},{k:"salidas.enlaceFinal",l:"Enlace de la nota"}]},{t:"Servicios",c:[{k:"servicios.antetitulo",l:"Antetítulo"},{k:"servicios.titulo",l:"Título"},{k:"servicios.entradilla",l:"Entradilla",f:"area"},{k:"servicios.foto",l:"Foto de fondo",f:"foto"}]},{t:"Cordilleras",c:[{k:"destinos.antetitulo",l:"Antetítulo"},{k:"destinos.titulo",l:"Título"},{k:"destinos.entradilla",l:"Entradilla",f:"area"}]},{t:"Rutas",c:[{k:"rutas.antetitulo",l:"Antetítulo"},{k:"rutas.titulo",l:"Título"},{k:"rutas.entradilla",l:"Entradilla",f:"area"},{k:"rutas.notaEscalas",l:"Nota sobre escalas",f:"area"}]},{t:"Explicación de los niveles",c:[{k:"niveles.iniciacion",l:"Iniciación",f:"area"},{k:"niveles.medio",l:"Medio",f:"area"},{k:"niveles.exigente",l:"Exigente",f:"area"},{k:"niveles.tecnico",l:"Técnico",f:"area"}]},{t:"Cita",c:[{k:"cita.texto",l:"Texto",f:"area"},{k:"cita.autora",l:"Autoría"},{k:"cita.foto",l:"Foto de fondo",f:"foto"}]},{t:"Preguntas",c:[{k:"preguntas.antetitulo",l:"Antetítulo"},{k:"preguntas.titulo",l:"Título"}]},{t:"Contacto",c:[{k:"contacto.titulo",l:"Título"},{k:"contacto.texto",l:"Texto",f:"area"},{k:"contacto.botonEnviar",l:"Texto del botón"},{k:"contacto.foto",l:"Foto de fondo",f:"foto"}]}]},

    if(!API){S.listo=true;pintar();return}
    const guardada=leerCache(),peticion=Almacen.remoto();
    if(guardada){aplicar(guardada);S.listo=true;pintar();
      /* El panel ya se ve; se actualiza por detrás si hay datos más nuevos y nadie está editando. */
      peticion.then(nuevo=>{if(JSON.stringify(nuevo)===JSON.stringify(guardada))return;if(S.dirty||S.idx!==null)return;escribirCache(nuevo);aplicar(nuevo);S.draft=null;pintar()}).catch(()=>{});
      return}
    /* Primera vez en este navegador: hay que esperar para no editar datos antiguos. */
    aplicar(await peticion.then(n=>(escribirCache(n),n)));S.listo=true;pintar();
  }catch{work.innerHTML=`<p class="empty">No se ha podido cargar el contenido. Recarga la página en unos segundos.</p>`}
}
function vistaLogin(error=""){
  work.innerHTML=`<form class="login" id="login"><h1>Entrar</h1><div class="field"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>${error?`<p class="err" role="alert">${esc(error)}</p>`:""}<button class="btn" type="submit">Entrar al panel</button></form>`;
  $("#clave").focus();
  $("#login").addEventListener("submit",async e=>{e.preventDefault();Sesion.set($("#clave").value);const b=$("#login button");b.disabled=true;b.textContent="Comprobando…";
    try{await llamar({accion:"comprobar"});arrancar()}catch(x){const mal=x.codigo==="password";Sesion.borrar();vistaLogin(mal?"La contraseña no es correcta.":"No se ha podido conectar. Inténtalo de nuevo.")}});
}
$("#modo").textContent=API?"Versión de prueba: los cambios guardados se verán en la web para todo el mundo.":"Modo demostración: los cambios se guardan solo en este navegador y nadie más los ve.";
document.body.classList.toggle("conectado",!!API);
if(API&&!Sesion.get()){vistaLogin()}else{arrancar()}
</script>
</body>
</html>
